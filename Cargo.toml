[package]
name = "ytrans"
version = "0.1.1"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
base64 = "0.23.1"
